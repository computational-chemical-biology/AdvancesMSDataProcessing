# nginx config for the static MyST book (see Dockerfile.book).
#
# `jupyter-book build --html` writes one directory per page containing index.html, so
# /pyopenms-prerequisites is served by the normal index resolution. The try_files fallback
# keeps client-side routes (anchors, search) working as well.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /pyopenms-prerequisites is a directory: nginx would 301 to
    # http://<host>/pyopenms-prerequisites/ and, with port_in_redirect off (default),
    # drop the port -> the browser lands on :80 and gets nothing. Relative redirects
    # keep the client on the port it asked for.
    absolute_redirect off;

    gzip on;
    gzip_types text/html application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # hashed build assets are immutable
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # the sidebar/TOC manifest must never be cached hard, or old builds stick around
    location = /config.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri/index.html /index.html;
    }
}
