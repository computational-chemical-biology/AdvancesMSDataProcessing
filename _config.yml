# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: Advanced Mass Spectrometry Data Processing
author: Ricardo R. Alves da Silva

# Force re-execution of notebooks on each build.
# Many notebooks download data or need heavy runtimes, so we build without
# executing to keep the build fast and reproducible. Run the notebooks
# interactively in JupyterLab to execute the code.
execute:
  execute_notebooks: off

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Information about where the book exists on the web
repository:
  url: https://github.com/computational-chemical-biology/AdvancesMSDataProcessing  # Online location of your book
  branch: master  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: true
  use_repository_button: true

sphinx:
  config:
    html_js_files:
    - https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.4/require.min.js